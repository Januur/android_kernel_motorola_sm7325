name: Build Kernel - Motorola Edge 2021

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-20
          fetch-depth: 1

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y \
            git make bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu python3 ccache \
            zip unzip curl wget

      - name: Download Clang toolchain
        run: |
          mkdir -p ~/clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz -O ~/clang.tar.gz
          tar -xf ~/clang.tar.gz -C ~/clang
          echo "Clang version:"
          ~/clang/bin/clang --version

      - name: Download GCC toolchains
        run: |
          mkdir -p ~/gcc64 ~/gcc32
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            --depth=1 ~/gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            --depth=1 ~/gcc32

      - name: Build kernel
        run: |
          export PATH="$HOME/clang/bin:$HOME/gcc64/bin:$HOME/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

        echo "=== Step 1: Base defconfig ==="
          make O=out ARCH=arm64 vendor/lahaina-qgki_defconfig

          echo "=== Step 2: Merge berlna config ==="
          scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            arch/arm64/configs/vendor/lineage_berlna.config

          echo "=== Step 3: Finalize config ==="
          make O=out ARCH=arm64 olddefconfig

          echo "=== Step 4: Compile! ==="
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Check output
        run: |
          echo "=== Kernel Images ==="
          find out/arch/arm64/boot/ -type f | head -20
          ls -lh out/arch/arm64/boot/ 2>/dev/null

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 ~/AnyKernel3
          IMAGE=$(find out/arch/arm64/boot/ -name "Image*" | head -1)
          echo "Image found: $IMAGE"
          cp $IMAGE ~/AnyKernel3/ 2>/dev/null || echo "Image copy failed!"
          cd ~/AnyKernel3
          zip -r9 ~/kernel-berlna.zip * -x .git README.md
          ls -lh ~/kernel-berlna.zip

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-berlna-Image
          path: out/arch/arm64/boot/Image*

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-berlna-zip
          path: ~/kernel-berlna.zip
